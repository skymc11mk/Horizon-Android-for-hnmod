[mod]
id = "fullbright_nofog"
version = "1.0.0"
priority = 100

# The Nightly it was made against (2026-11-01). It uses only the native hook
# points (hooks 80 in horizon-native.json, for render_fog): the launcher builds
# it on any Horizon that has them.
[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

# The settings and the command parsing as plain values (no game types).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "fullbright_nofog"
source = "runtime.rs"

# Each frame: the renderer's lightmap gamma is 15 while Fullbright is on. The
# slider and options.txt are never changed.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The final fog, before it goes to the GPU: pushed past the view while NoFog is on.
[[injection]]
id = "fog"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_render_fog"
helper = "fog.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "fog_type", ty = "horizon_client::fog::FogType", value = "fog_type" },
  { name = "fog", ty = "&mut horizon_client::fog::FogData", value = "&mut *fog" },
]

# /fullbright and /nofog, typed or clicked in chat (before the server sees them).
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# The toggle keys (G and N, rebindable in Options > Mods).
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
